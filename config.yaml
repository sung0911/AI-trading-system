# =====================================================================
#  설정 파일 (config.yaml)
#  - 프로그램이 쓰는 "숫자"와 "종목 목록"을 전부 여기 모아둔다.
#  - 규칙을 바꾸고 싶으면 코드 대신 이 파일의 숫자만 고치면 된다.
#  - '#' 뒤는 설명(주석)이라 프로그램이 무시한다.
#  - 비율은 소수로 쓴다:  0.05 = 5%,  0.15 = 15%,  0.0005 = 0.05%
# =====================================================================


# ---------------------------------------------------------------------
# [1] 시장 설정: 미국(us)과 한국(kr) 계좌를 따로 운영한다.
#     달러와 원화를 섞지 않기 위해 계좌를 분리한다.
# ---------------------------------------------------------------------
markets:
  us:                               # ── 미국 주식 계좌 ──
    currency: USD                   # 통화: 달러
    initial_cash: 100000            # 시작 자금: 10만 달러 (가짜 돈)
    benchmark: "^GSPC"              # 비교 대상(벤치마크): S&P 500 지수
                                    #  → "그냥 지수를 샀으면 얼마 벌었나?"와 비교하기 위함
    symbols: [AAPL, MSFT, NVDA, AMZN, GOOGL, META, AVGO, TSLA, JPM, COST]
                                    # 거래 대상 종목 (티커 = 종목 코드)
                                    #  애플, 마이크로소프트, 엔비디아, 아마존, 구글,
                                    #  메타, 브로드컴, 테슬라, JP모건, 코스트코
    costs:                          # ── 거래 비용 (실제 매매에서 새는 돈) ──
      commission: 0.0005            # 수수료: 살 때·팔 때 각각 거래금액의 0.05%
      slippage: 0.0005              # 슬리피지: 원하는 가격에 딱 못 사고 조금 불리하게 체결되는 차이
                                    #  → 살 때는 0.05% 비싸게, 팔 때는 0.05% 싸게 체결된다고 가정
      sell_tax: 0.0                 # 매도 세금: 미국 주식은 팔 때 거래세 없음

  kr:                               # ── 한국 주식 계좌 ──
    currency: KRW                   # 통화: 원
    initial_cash: 100000000         # 시작 자금: 1억 원 (가짜 돈)
    benchmark: "KS11"               # 비교 대상: 코스피 지수
    symbols: ["005930", "000660", "373220", "207940", "005380",
              "000270", "068270", "035420", "105560", "035720"]
                                    # 삼성전자, SK하이닉스, LG에너지솔루션, 삼성바이오로직스, 현대차,
                                    # 기아, 셀트리온, 네이버, KB금융, 카카오
    costs:
      commission: 0.00015           # 수수료: 0.015%
      slippage: 0.001               # 슬리피지: 0.1%
      sell_tax: 0.0020              # 증권거래세: 팔 때만 0.20% (가정치, 실제 세율은 확인 필요)


# ---------------------------------------------------------------------
# [2] 주가 데이터 다운로드 설정
#     인터넷에서 매일의 주가(시가·고가·저가·종가·거래량)를 받아 컴퓨터에 저장해 둔다.
#     한 번 받은 건 저장해 두고, 다음부터는 새로 생긴 날짜만 받는다(증분 업데이트).
# ---------------------------------------------------------------------
data:
  cache_dir: data/cache             # 받은 주가를 저장할 폴더
  start: "2015-01-01"               # 이 날짜부터의 주가를 받는다
  request_delay_sec: 0.5            # 종목 하나 받을 때마다 0.5초 쉰다
                                    #  → 너무 빨리 요청하면 데이터 제공처가 접속을 막을 수 있어서
  batch_size: 10                    # 10종목 받을 때마다
  batch_pause_sec: 3.0              #  3초 더 쉰다
  retries: 3                        # 다운로드 실패 시 최대 3번까지 다시 시도
  retry_delay_sec: 2.0              # 재시도 전 대기 시간 (2초 → 4초 → ...점점 길게)
  overlap_days: 5                   # 새 데이터를 받을 때 마지막 5일은 겹치게 다시 받아서
  adjust_check_tol: 0.005           #  저장본과 0.5% 넘게 다르면 → 전체를 새로 받는다
                                    #  (액면분할·배당으로 과거 주가가 통째로 바뀌는 경우 대비)


# ---------------------------------------------------------------------
# [3] 박스권 매매 전략 규칙
#
#   박스권(횡보) = 주가가 일정한 위아래 범위 안에서 오르내리는 구간
#
#        상단 ───────────────────────  ← 여기 가까이 오면 팔기(익절)
#             /\      /\      /\
#            /  \    /  \    /  \
#        하단 ────\/──────\/───────\  ← 하단을 2번 받친 뒤 3번째로 오면 사기
#                                   \
#        하단-5% ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─\  ← 여기 밑으로 떨어지면 팔기(손절)
# ---------------------------------------------------------------------
strategy:
  box:
    lookback: 60                    # 최근 60거래일(약 3개월)을 보고 박스를 판단
                                    #  (오늘은 빼고 어제까지 60일만 사용 → 미래 정보 사용 방지)
    max_width_pct: 0.15             # 박스 폭 조건: (상단 - 하단) ÷ 하단 이 15% 이하여야 박스로 인정
                                    #  → 범위가 너무 넓으면 횡보가 아니라 큰 변동으로 봄
    touch_tol_pct: 0.015            # "하단 터치" 판정 여유: 하단보다 1.5% 위까지 내려오면 터치로 인정
    rebound_frac: 0.5               # 터치 후 박스 폭의 50% 이상 올라가야 "한 번 받쳐줬다"로 센다
                                    #  → 하단 근처에서 계속 머무는 건 여러 번이 아니라 1번으로 침
    min_bottom_touches: 2           # 하단을 최소 2번 받쳐줘야 매수 대상 (사용자 요청 조건)
    min_top_touches: 1              # 상단을 최소 1번 찍고 내려와야 함 (1 = 사실상 조건 없음)
    entry_zone_frac: 0.20           # 매수 구간: 종가가 [하단 ~ 하단 + 박스폭의 20%] 안에 들어오면 매수
                                    #  예) 하단 100, 상단 110 → 폭 10 → 100~102 사이면 매수
    exit_zone_frac: 0.20            # 익절 구간: 종가가 [상단 - 박스폭의 20%] 이상이면 매도
                                    #  예) 위와 같으면 108 이상에서 매도
    stop_below_box_pct: 0.05        # 손절: 종가가 박스 하단보다 5% 넘게 떨어지면 매도 (사용자 요청 조건)
                                    #  예) 하단 100 → 종가 95 미만이면 손절


# ---------------------------------------------------------------------
# [4] 위험 관리: 한 종목에 몰빵하지 않기 위한 안전장치
# ---------------------------------------------------------------------
risk:
  max_weight: 0.10                  # 한 종목에는 전체 자산의 최대 10%만 투자
  max_positions: 10                 # 동시에 최대 10종목까지만 보유
  max_hold_days: 60                 # 60거래일(약 3개월) 넘게 들고 있으면 결과와 상관없이 매도
                                    #  (끄고 싶으면 null 로 바꾼다)


# ---------------------------------------------------------------------
# [5] 백테스트 기간: "과거에 이 규칙대로 했으면?"을 시험해볼 기간
#     (데이터는 2015년부터 받지만, 박스 판단에 60일이 필요해서 2016년부터 시작)
# ---------------------------------------------------------------------
backtest:
  start: "2016-01-01"               # 시작일
  end: null                         # 종료일 (null = 가장 최근 데이터까지)


# ---------------------------------------------------------------------
# [6] 결과 리포트 / 로그
# ---------------------------------------------------------------------
report:
  out_dir: reports                  # 성적표·그래프를 저장할 폴더
  max_symbol_charts: 10             # 종목별 차트를 최대 몇 개까지 저장할지 (거래 많은 종목 순)

logging:
  dir: logs                         # 매매 기록·판단 근거(로그)를 저장할 폴더
  level: INFO                       # 로그 상세도 (INFO = 보통, DEBUG = 아주 자세히)
